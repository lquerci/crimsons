[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crimsons"
version = "0.1.0"
description = "Stochastic chemical enrichment of stellar populations (SNII, SNIa, AGB) from a sampled IMF."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Lapo Querci", email = "lapo.querci@unifi.it" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "tqdm>=4.70"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff"]
plot = ["matplotlib"]
parallel = ["joblib"]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "pymdown-extensions>=10.9",

]

[project.urls]
Homepage = "https://github.com/lquerci/crimsons"
Issues = "https://github.com/lquerci/crimsons/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/crimsons"]

# Belt-and-suspenders alongside `packages` above: force-include/artifacts
# are explicitly documented as NOT subject to .gitignore filtering, unlike
# every other file-selection option (including `packages`/`only-include`).
# If a broad .gitignore rule (e.g. "*.h5" or "data/") ever catches these,
# these entries keep the yield tables and solar-abundance data shipping
# regardless. Safe to remove once you've verified (see the check below)
# that plain `packages` already covers it on its own.
[tool.hatch.build.targets.wheel.force-include]
"src/crimsons/yields/data" = "crimsons/yields/data"
"src/crimsons/yields/manifest.yaml" = "crimsons/yields/manifest.yaml"
"src/crimsons/data" = "crimsons/data"

[tool.hatch.build.targets.sdist]
artifacts = [
    "src/crimsons/yields/data/*",
    "src/crimsons/yields/manifest.yaml",
    "src/crimsons/data/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]